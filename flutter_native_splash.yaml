flutter_native_splash:
  # Enable/disable platforms (optional)
  android: true
  ios: true
  web: true

  # ============================================================
  # MAIN SPLASH CONFIG (all platforms except Android 12+)
  # ============================================================

  # Background color (must NOT be transparent)
  color: "#ffffff"   # white background

  # Splash image (PNG)
  image: assets/images/native_splash.png

  # Optional: hide Android notification bar
  fullscreen: true

  # ============================================================
  # ANDROID 12+ CONFIG
  # ============================================================
  android_12:
    # Android 12 background color
    color: "#ffffff"

    # Splash image for Android 12+
    image: assets/images/native_splash.png

    # Icon background color (must NOT be transparent)
    icon_background_color: "#ffffff"
